# Added 2026-08-21 with the exec-once -> systemd startup migration.
# The user manager hands services a soft RLIMIT_NOFILE of 1024, which is what
# too_many_unix_fds() compares the per-user in-flight SCM_RIGHTS count against.
# Every graphical client wants the raised limit, not just the ones we wrote.
[Service]
LimitNOFILE=524288:524288
