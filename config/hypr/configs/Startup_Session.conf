# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# Session bring-up (vendor-owned; deployed on every upgrade, never restored
# from backup). Put your own apps in UserConfigs/Startup_Apps.conf instead.
#
# Long-lived daemons (wallpaper daemon, waybar, hypridle, nm-applet, cliphist,
# quickshell, copyq, IdlePowerWatch, the polkit agent) are NOT started here.
# They are systemd user units pulled in by hyprland-session.target; the
# installer (scripts/lib_units.sh) ships and enables them. See
# docs/adr/run-session-daemons-as-systemd-user-units.md.
#
# Why: an exec-once child inherits Hyprland's *pre-raise* RLIMIT_NOFILE soft
# limit of 1024. That 1024 is the number the kernel's too_many_unix_fds()
# compares the per-user in-flight SCM_RIGHTS count against, so an exec-once
# child is the first thing to die when file descriptors run short. A unit sets
# LimitNOFILE and gets out of that failure mode; an exec-once cannot.
#
# What belongs here: anything that manipulates compositor state and so has to
# run inside a live Hyprland.

$scriptsDir = $HOME/.config/hypr/scripts

# Bring up the systemd session. Under uwsm (the compositor runs inside
# wayland-wm@*.service) `uwsm finalize` exports the session environment and
# starts graphical-session.target, which pulls hyprland-session.target. Under
# the plain hyprland.desktop session nothing else starts graphical-session.target;
# hyprland-session.target BindsTo it, so starting ours pulls the whole set up.
exec-once = sh -c 'grep -q "wayland-wm@" /proc/self/cgroup && exec uwsm finalize || exec systemctl --user start hyprland-session.target'

# Export the session environment into the user manager. uwsm already does this;
# the plain hyprland.desktop session does not, and without it the units have no
# WAYLAND_DISPLAY and cannot reach the compositor. Idempotent under uwsm.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# Compositor state -- needs hyprctl and a running Hyprland.
exec-once = hyprpm reload
exec-once = $scriptsDir/KeybindsLayoutInit.sh
exec-once = $scriptsDir/HideXwaylandBridge.sh
exec-once = $scriptsDir/Dropterminal.sh --preload kitty
exec-once = $scriptsDir/Hyprsunset.sh init
