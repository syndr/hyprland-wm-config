# Per-machine environment OVERRIDES.
# See https://wiki.hyprland.org/Configuring/Environment-variables/
#
# The vendor configs/ENVariables.conf is sourced just BEFORE this file and now
# carries the fork's full environment + theming (Kvantum Qt, broodwar cursor,
# toolkit/Wayland defaults) plus the installer's per-hardware autodetect
# (NVIDIA / VM / hybrid-GPU). Anything set here is sourced LAST, so it wins.
# Keep this file minimal — only genuine per-machine overrides belong here.
#
# Default editor lives in ~/.config/hypr/UserConfigs/01-UserDefaults.conf

# Flatpak-safety guard: pin Qt-Quick style to Basic even if the installer
# detects org.hyprland.style on this machine. That QML module leaks into Flatpak
# sandboxes (which can't see it) and makes Qt-Quick apps error. Remove only if
# you also run: flatpak override --user --unset-env=QT_QUICK_CONTROLS_STYLE
env = QT_QUICK_CONTROLS_STYLE,Basic

# ── Manual per-machine overrides (examples; uncomment as needed) ──
# These win over the vendor base + installer autodetect because this file is
# sourced last.

# Force NVIDIA env (e.g. if autodetect misses on an NVIDIA box):
#env = LIBVA_DRIVER_NAME,nvidia
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
#env = NVD_BACKEND,direct
#env = GSK_RENDERER,ngl

# VM / software-render fallback (may cause crashes on real GPUs — use with care):
#env = WLR_RENDERER_ALLOW_SOFTWARE,1

# Force a specific primary GPU (multi-GPU; first path is primary):
#env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# Run SDL2 apps on Wayland (set to x11 if older-SDL games misbehave):
#env = SDL_VIDEODRIVER,wayland
