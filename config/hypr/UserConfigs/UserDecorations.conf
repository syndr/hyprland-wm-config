# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 2
  gaps_in = 3
  gaps_out = 5

  col.active_border = rgb(4cff00)
  col.inactive_border = rgb(21ad42)
}

decoration {
  rounding = 0
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0

  dim_inactive = false
  dim_strength = 0.05
  dim_special = 0.8

  shadow {
    enabled = true
    range = 10
    render_power = 4

    color = rgb(21ad42)
    color_inactive = rgb(133100)
  }

  blur {
    enabled = true
    size = 4
    passes = 1
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = rgba(4cff00ee)
  col.border_inactive = rgba(21ad4280)
  col.border_locked_active = rgba(996600ee)
  col.border_locked_inactive = rgba(99660080)

  groupbar {
    enabled = true
    height = 18
    render_titles = true
    font_size = 12
    gradients = true

    col.active = rgb(0d3b00)
    col.inactive = rgb(0a0a0a)
    col.locked_active = rgb(332200)
    col.locked_inactive = rgb(1a1000)

    text_color = rgba(4cff00ff)
  }
}
