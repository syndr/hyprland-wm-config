# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

# common shortcuts
bindd = $mainMod, R, launcher menu, exec, $scriptsDir/RofiLauncher.sh
bindd = $mainMod, BackSpace, app launcher, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window
#bindd = $mainMod, A, desktop overview (hyprexpo), hyprexpo:expo, toggle
#bindd = $mainMod, A, ags overview, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
#bindd = $mainMod, A, Quickshell overview, global, quickshell:overviewToggle # desktop overview (if installed)
# Lock screen
bindd = $mainMod, grave, lock screen, exec, $scriptsDir/LockScreen.sh

# FEATURES / EXTRAS
bindd = $mainMod, bracketleft, orientation prev, layoutmsg, orientationprev
bindd = $mainMod, bracketright, orientation next, layoutmsg, orientationnext
bindd = $mainMod, V, copyq toggle, exec, copyq toggle

# Desktop zooming or magnifier
bindd = $mainMod ALT, mouse_down, zoom in, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.25}')"
bindd = $mainMod ALT, mouse_up, zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.25}')"

# Zoom mode submap (Meta+Alt+Z to enter, scroll to zoom, Escape/Meta+Alt+Z to exit)
bindd = $mainMod ALT, Z, enter zoom mode, submap, zoom
submap = zoom
bind = , mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.25}')"
bind = , mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.25}')"
bind = , escape, submap, reset
bind = $mainMod ALT, Z, submap, reset
submap = reset

## NOTES for ja (Hyprland version 0.39 (Ubuntu 24.04))
#bind = $mainMod ALT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#bind = $mainMod ALT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

# FEATURES / EXTRAS (UserScripts)
bindd = $mainMod ALT, Print, delayed screenshot (area in 5s), exec, $scriptsDir/ScreenShot.sh --area-in5
bindd = $mainMod ALT, X, delayed screenshot (focused monitor in 5s), exec, $scriptsDir/ScreenShot.sh --monitor-in5

# Move current workspaces to monitors (left right up or down)
# NOTE: moved to CTRL+SHIFT to avoid conflict with workspace CTRL+F9-F12 binds
bindd = $mainMod CTRL SHIFT, F9, move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL SHIFT, F10, move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL SHIFT, F11, move workspace to up monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL SHIFT, F12, move workspace to down monitor, movecurrentworkspacetomonitor, d


# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# Workspace/monitor-specific bindings belong in
# ~/.config/hypr/UserConfigs/WorkspaceKeybinds.conf so updates preserve
# workstation-specific layouts without shipping them as repo defaults.

# Change focus to another monitor
bindd = $mainMod, 5, focus monitor right, focusmonitor, +1
bindd = $mainMod, 6, focus monitor left, focusmonitor, -1

# Mouse button workspace navigation
# Button codes from libinput: BTN_FORWARD=277, BTN_BACK=278, BTN_TASK=279
# (Hyprland uses raw evdev codes, not logical button numbers like 8/9)
bindd = , mouse:277, previous workspace on current monitor, exec, $scriptsDir/WorkspaceCycle.sh prev
bindd = , mouse:278, next workspace on current monitor, exec, $scriptsDir/WorkspaceCycle.sh next
bindrd = , mouse:279, desktop overview, exec, $scriptsDir/OverviewToggle.sh
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
