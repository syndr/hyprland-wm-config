# Startup applications.
#
# Long-lived daemons are NOT started here. They are systemd user units in
# ~/.config/systemd/user/, pulled in by hyprland-session.target.
#
# Why: an exec-once child inherits Hyprland's *pre-raise* RLIMIT_NOFILE soft
# limit of 1024. That 1024 is the number the kernel's too_many_unix_fds()
# compares the per-user in-flight SCM_RIGHTS count against, so an exec-once
# child is the first thing to die when file descriptors run short. A unit sets
# LimitNOFILE and gets out of that failure mode; an exec-once cannot.
#
# What still belongs here: anything that manipulates compositor state and so
# has to run inside a live Hyprland.

$scriptsDir = $HOME/.config/hypr/scripts

# Bring up the systemd session. Under uwsm hyprland-session.target is already
# active (WantedBy=graphical-session.target), so this is a no-op. Under the
# plain hyprland.desktop session nothing else starts graphical-session.target;
# hyprland-session.target BindsTo it, so this pulls the whole set up.
exec-once = systemctl --user start hyprland-session.target

# Export the session environment into the user manager. uwsm already does this;
# the plain hyprland.desktop session does not, and without it the units have no
# WAYLAND_DISPLAY and cannot reach the compositor. Idempotent under uwsm.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Compositor state -- needs hyprctl and a running Hyprland.
exec-once = hyprpm reload
exec-once = hyprctl setcursor Broodwar 24
exec-once = $scriptsDir/KeybindsLayoutInit.sh
exec-once = $scriptsDir/HideXwaylandBridge.sh
exec-once = $scriptsDir/Dropterminal.sh --preload kitty
exec-once = $scriptsDir/Hyprsunset.sh init

# Login chime.
exec-once = pw-play ~/Music/notifications/Error\ Spam.ogg

# Not in use. Kept so it is obvious they were considered, not forgotten.
# dex --autostart is deliberately off: XDG autostart is handled by systemd's
# xdg-desktop-autostart.target, and running dex as well would double-launch.
#exec-once = dex --autostart
