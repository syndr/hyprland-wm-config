# Your startup applications. This file is yours: the installer preserves it
# across upgrades and never rewrites it.
#
# Session bring-up (uwsm finalize / hyprland-session.target, env export,
# hyprpm reload, keybind + dropdown-terminal init) lives in the vendor-owned
# configs/Startup_Session.conf. Long-lived daemons (wallpaper daemon, waybar,
# hypridle, nm-applet, cliphist, quickshell, copyq, polkit agent) are systemd
# user units pulled in by hyprland-session.target -- add a unit, not an
# exec-once, for anything that should outlive a config reload:
#   systemctl --user list-dependencies hyprland-session.target
#
# Compositor-state tweaks and one-shots belong here.
exec-once = hyprctl setcursor Broodwar 24

# Login chime.
exec-once = pw-play ~/Music/notifications/Error\ Spam.ogg
