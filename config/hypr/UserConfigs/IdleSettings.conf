# Idle / lock-screen behavior overrides for KooL's Dots.
# This file is user-owned and preserved across updates. It is read at deploy
# time by copy.sh (scripts/lib_detect.sh: adjust_idle_dpms_policy) and patches
# the generated hypridle.conf. Shell KEY=value syntax. Re-run copy.sh (or just
# restart hypridle after editing hypridle.conf) for changes to take effect.
#
# Two independent knobs:
#
#   KOOL_IDLE_DPMS_OFF   (default 1)
#     1 = blank the displays shortly after lock, with a fallback, and turn them
#         back on with input (the stock behavior most users want).
#     0 = never DPMS-off: the screens stay lit showing hyprlock after lock.
#         Use this on multi-monitor rigs where some outputs do not reliably
#         wake from DPMS-off and come back black/unusable. Locking on idle and
#         the after-sleep dpms-ON are still preserved.
#
#   KOOL_IDLE_NAG        (default 0)
#     0 = no nag: strip the pre-lock IdleAlert audible warning and the post-lock
#         IdleWatchdog escalating squawk/screen-flash (off by default; most
#         desktop/laptop users do not want it).
#     1 = enable the nag/watchdog. Built for a sleepless handheld (e.g. the
#         ClockworkPi uConsole) that has no sleep mode, to badger you into
#         locking/leaving. Tune cadence/tiers in idle-alert.conf.
#
#   KOOL_IDLE_LOCK_TIMEOUT   (default: unset -> stock 600s / 10 min)
#     Seconds of inactivity before the session auto-locks. Positive integer;
#     anything else is ignored and the stock timeout is kept. e.g. 3600 = 1hr.
#
# Uncomment and set to override the defaults:
#
# KOOL_IDLE_DPMS_OFF=1
# KOOL_IDLE_NAG=0
# KOOL_IDLE_LOCK_TIMEOUT=600
