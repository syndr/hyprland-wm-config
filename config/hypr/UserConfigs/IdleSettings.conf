# Idle / lock-screen behavior for KooL's Dots.
#
# This file is user-owned and preserved across updates. It is the ONLY place
# to tune idle behavior: ~/.config/hypr/hypridle.conf is generated from these
# values and any edit made there is overwritten.
#
# After changing anything here:
#
#     ~/.config/hypr/scripts/GenerateHypridle.sh --restart
#
# Shell KEY=value syntax. The file is parsed with grep/sed, never sourced, so
# only plain assignments are read -- no command substitution, no variables.
#
# ---------------------------------------------------------------------------
# Why the timeouts are relative
# ---------------------------------------------------------------------------
# hypridle listeners take absolute seconds counted from the last input event,
# so a hand-written config ends up full of numbers like 1800 that only make
# sense once you know they mean "lock at 600, then animate for 1200". Every
# knob below is relative and named; GenerateHypridle.sh does the arithmetic
# and writes the derived schedule into the generated file's header.
#
# ---------------------------------------------------------------------------
# Why there are _AC and _BAT pairs
# ---------------------------------------------------------------------------
# hypridle cannot vary a timeout by power state. GenerateHypridle.sh therefore
# renders one profile at a time, and IdlePowerWatch.sh re-renders and reloads
# hypridle when the charger is plugged or unplugged (deferring the reload
# while the session is locked, since a restart resets every idle timer).
# The active profile is picked by scripts/OnBattery.sh, which fails open to
# battery when it cannot tell.
#
# Caveat worth knowing: unplugging part-way through an idle stretch does not
# retroactively fire a listener whose battery timeout has already passed. The
# new profile applies from the reload onward.


# Master switch. 0 hands hypridle.conf back to you: the generator stops
# running on deploy, IdlePowerWatch.sh exits immediately, and your file is
# restored from backup on upgrade exactly as it was before this feature.
KOOL_IDLE_MANAGED=1


# --- Lock ------------------------------------------------------------------
# Seconds of inactivity before the session auto-locks.
KOOL_IDLE_LOCK_TIMEOUT_AC=900
KOOL_IDLE_LOCK_TIMEOUT_BAT=300

# Seconds BEFORE the lock to show the "locking soon" warning. 0 disables it.
KOOL_IDLE_WARN_LEAD=30


# --- Screen power ----------------------------------------------------------
# 1 = blank the displays after lock and wake them on input (what most people
#     want).
# 0 = never DPMS-off: the screens stay lit showing the lockscreen. Use this on
#     multi-monitor rigs where an output does not reliably come back from
#     DPMS-off. Locking on idle and the after-sleep wake are unaffected.
KOOL_IDLE_DPMS_OFF=1

# Seconds AFTER the lock before the screens blank, when locked with hyprlock.
KOOL_IDLE_DPMS_DELAY_AC=15
KOOL_IDLE_DPMS_DELAY_BAT=15


# --- Screensaver (swaylock-plugin) -----------------------------------------
# Seconds AFTER the lock that the xscreensaver hack is allowed to animate
# before the screens blank. Only applies when swaylock-plugin is the locker;
# hyprlock keeps the quicker KOOL_IDLE_DPMS_DELAY_* above. Battery is much
# tighter on purpose -- a GL hack is one of the most expensive things an idle
# handheld can be doing.
KOOL_IDLE_SCREENSAVER_AC=1200
KOOL_IDLE_SCREENSAVER_BAT=120

# 1 = SIGSTOP the hack's process group whenever the panel is dark, and resume
#     it when the panel comes back. swaylock-plugin has no DPMS handling of
#     its own and an Xwayland-hosted hack is not frame-callback throttled, so
#     without this it keeps rendering at full rate into a screen that is off.
KOOL_IDLE_SCREENSAVER_PAUSE=1

# 1 = also watch for screen-off that the compositor never sees -- on the
#     uConsole, the power key parks the panel through uconsole-sleep while
#     Hyprland still believes its outputs are lit. Cheap: it only runs while
#     a locker is up.
KOOL_IDLE_SCREENSAVER_PAUSE_WATCH=1

# Seconds between those checks.
KOOL_IDLE_SCREENSAVER_PAUSE_INTERVAL=5


# --- Nag / watchdog --------------------------------------------------------
# 0 = no nag: no pre-lock audible cue, no post-lock escalating squawk and
#     screen-flash. Off by default; most desktop and laptop users do not want
#     it.
# 1 = enabled. Built for a sleepless handheld (e.g. the ClockworkPi uConsole)
#     with no sleep mode, to badger you into locking or leaving. Tune the
#     cadence, tiers and flash pattern in ../idle-alert.conf.
#
# Note: on hosts running the uconsole-sleep package, its sleep-idle-alert
# user service already does this DE-agnostically -- leave this at 0 there to
# avoid two escalators squawking over each other.
KOOL_IDLE_NAG=0


# --- Legacy ----------------------------------------------------------------
# A bare KOOL_IDLE_LOCK_TIMEOUT (pre-2.3.26) still works and seeds both
# profiles when the _AC/_BAT keys above are absent. The same fallback applies
# to KOOL_IDLE_DPMS_DELAY and KOOL_IDLE_SCREENSAVER.
