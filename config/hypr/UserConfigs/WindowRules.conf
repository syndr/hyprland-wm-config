# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
#
# User window rules overlay
# Use modern Hyprland >= 0.53 syntax only.
# This file is intentionally minimal and preserved across updates.
#
# Examples:
# windowrule = match:class ^(org.kde.kcalc|kcalc)$, float on
# windowrule = match:title ^(Picture-in-Picture)$, pin on
# windowrule = match:class ^(thunar)$ match:title ^(File Operation Progress)$, float on, center on


#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi
