# Workstation-specific workspace bindings live here.
# This file is sourced after UserKeybinds.conf and should be preserved across upgrades.
#
# The shipped defaults in configs/Keybinds.conf already provide a reasonable
# single-monitor workspace setup on SUPER+1..0 and their SHIFT/CTRL variants.
# Use this file only when you want to override that with monitor-specific maps.
#
# Example pattern:
# unbind = $mainMod, code:10
# bindd = $mainMod, F1, workspace 1, workspace, 1
# bindd = $mainMod SHIFT, F1, move to workspace 1, movetoworkspace, 1
# bindd = $mainMod CTRL, F1, move silently to workspace 1, movetoworkspacesilent, 1
