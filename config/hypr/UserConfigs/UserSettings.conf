# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/

# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf

debug {
  disable_logs = true
}

dwindle {
  pseudotile = true
  preserve_split = true
  smart_split = true
  smart_resizing = true
  special_scale_factor = 0.8
  split_bias = 1
  split_width_multiplier = 1.5
}

master {
  new_status = master
  new_on_top = 1
  mfact = 0.5
  allow_small_split = false
}

# hyprNStack - multi-stack tiling layout (disabled)
# https://github.com/zakk4223/hyprNStack
# plugin {
#   nstack {
#     stacks = 3          # 1 master + 2 stacks
#     mfact = 0.5         # master takes 50% width
#     orientation = left  # master on left
#   }
# }

plugin {
  hy3 {
    # disable gaps when only one window is onscreen
    # 0 - always show gaps
    # 1 - hide gaps with a single window onscreen
    # 2 - 1 but also show the window border
    no_gaps_when_only = 2 # default: 0

    # policy controlling what happens when a node is removed from a group,
    # leaving only a group
    # 0 = remove the nested group
    # 1 = keep the nested group
    # 2 = keep the nested group only if its parent is a tab group
    #node_collapse_policy = <int> # default: 2

    # offset from group split direction when only one window is in a group
    #group_inset = <int> # default: 10

    # if a tab group will automatically be created for the first window spawned in a workspace
    #tab_first_window = <bool>

    # tab group settings
    tabs {
      # height of the tab bar
      #height = <int> # default: 22

      # padding between the tab bar and its focused node
      #padding = <int> # default: 6

      # the tab bar should animate in/out from the top instead of below the window
      #from_top = <bool> # default: false

      # radius of tab bar corners
      radius = 0 # default: 6

      # tab bar border width
      border_width = 2 # default: 2

      # render the window title on the bar
      render_text = true # default: true

      # center the window title
      text_center = true # default: true

      # font to render the window title with
      #text_font = <string> # default: Sans

      # height of the window title
      #text_height = <int> # default: 8

      # left padding of the window title
      #text_padding = <int> # default: 3

      # active tab bar segment colors (black bg, green border/text)
      col.active = rgba(000000cc)
      col.active.border = rgba(4cff00ee)
      col.active.text = rgba(4cff00ff)

      # active tab bar segment colors for bars on an unfocused monitor
      col.active_alt_monitor = rgba(000000aa)
      col.active_alt_monitor.border = rgba(21ad42cc)
      col.active_alt_monitor.text = rgba(21ad42ff)

      # focused tab bar segment colors (focused node in unfocused container)
      col.focused = rgba(000000aa)
      col.focused.border = rgba(21ad42ee)
      col.focused.text = rgba(21ad42ff)

      # inactive tab bar segment colors (darker, dimmer green)
      col.inactive = rgba(00000080)
      col.inactive.border = rgba(21ad4280)
      col.inactive.text = rgba(21ad42aa)

      # urgent tab bar segment colors (orange/amber for visibility)
      col.urgent = rgba(000000cc)
      col.urgent.border = rgba(ff9900ee)
      col.urgent.text = rgba(ff9900ff)

      # locked tab bar segment colors (muted amber)
      col.locked = rgba(000000cc)
      col.locked.border = rgba(996600ee)
      col.locked.text = rgba(996600ff)

      # if tab backgrounds should be blurred
      # Blur is only visible when the above colors are not opaque.
      #blur = <bool> # default: true

      # opacity multiplier for tabs
      # Applies to blur as well as the given colors.
      opacity = 0.9 # default: 1.0
    }

    # autotiling settings
    autotile {
      # enable autotile
      enable = true # default: false

      # make autotile-created groups ephemeral
      #ephemeral_groups = <bool> # default: true

      # if a window would be squished smaller than this width, a vertical split will be created
      # -1 = never automatically split vertically
      # 0 = always automatically split vertically
      # <number> = pixel width to split at
      #trigger_width = <int> # default: 0

      # if a window would be squished smaller than this height, a horizontal split will be created
      # -1 = never automatically split horizontally
      # 0 = always automatically split horizontally
      # <number> = pixel height to split at
      #trigger_height = <int> # default: 0

      # a space or comma separated list of workspace ids where autotile should be enabled
      # it's possible to create an exception rule by prefixing the definition with "not:"
      # workspaces = 1,2 # autotiling will only be enabled on workspaces 1 and 2
      # workspaces = not:1,2 # autotiling will be enabled on all workspaces except 1 and 2
      #workspaces = <string> # default: all
    }
  }
}

general {
  resize_on_border = true
  layout = dwindle
}

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300
  
  sensitivity = 0 #mouse sensitivity
  #accel_profile =     # flat or adaptive or blank or EMPTY means libinput’s default mode
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = true 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
  }
  
  # below for devices with touchdevice ie. touchscreen
	touchdevice {
		enabled = true
	}
	
	# below is for table see link above for proper variables
	tablet {
		transform = 0
		left_handed = 0
	}
}

plugin:dynamic-cursors {
  # enables the plugin
  enabled = true

  # sets the cursor behaviour, supports these values:
  # tilt    - tilt the cursor based on x-velocity
  # rotate  - rotate the cursor based on movement direction
  # stretch - stretch the cursor shape based on direction and velocity
  # none    - do not change the cursors behaviour
  mode = tilt
}

gestures {
  gesture = 3, horizontal, workspace
  workspace_swipe_distance = 500
  workspace_swipe_invert = true
  workspace_swipe_min_speed_to_force = 30
  workspace_swipe_cancel_ratio = 0.5
  workspace_swipe_create_new = true 
  workspace_swipe_forever = true
  #workspace_swipe_use_r = true #uncomment if wanted a forever create a new workspace with swipe right
  gesture = 3, up, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 1.5}')"
  gesture = 3, down, dispatcher, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 1.5}')" 
}

misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  vfr = true
  vrr = 2
  mouse_move_enables_dpms = true
  enable_swallow = off
  swallow_regex = ^(kitty)$
  focus_on_activate = false
  initial_workspace_tracking = 0
  middle_click_paste = false
  enable_anr_dialog = true    # Application not Responding (ANR)
  anr_missed_pings = 15       # ANR Threshold default 1 is too low
  allow_session_lock_restore = true  # Prevent lockscreen crash when resume from suspend
}

#opengl {
#  nvidia_anti_flicker = true
#}

#quirks {
#  prefer_hdr = 0
#}

binds {
  workspace_back_and_forth = true
  allow_workspace_cycles = true
  pass_mouse_when_bound = false
}

#Could help when scaling and not pixelating
xwayland {
  enabled = true
  force_zero_scaling = true
}

render {
  direct_scanout = 0
}

cursor {
  sync_gsettings_theme = true
  no_hardware_cursors =  2 # change to 1 if want to disable
  enable_hyprcursor = true
  warp_on_change_workspace = 2
  no_warps = true
}

# split-monitor-workspaces plugin configuration
# https://github.com/Duckonaut/split-monitor-workspaces
plugin {
  split-monitor-workspaces {
    count = 4
  }
}

