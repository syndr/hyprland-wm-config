# /* ---- 💫 https://github.com/syndr/hyprland-wm-config 💫 ---- */  #
# Hypridle 
# Original config submitted by https://github.com/SherLock707                                                       
                                                      
$iDIR = $HOME/.config/swaync/images/ja.png
$scriptsDir = $HOME/.config/hypr/scripts

general {
    # Lock + spawn the post-lock watchdog (detached). Watchdog exits on unlock via pidof check.
    lock_cmd = (pidof hyprlock || hyprlock) & setsid -f $scriptsDir/IdleWatchdog.sh
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on # turn of screen after sleep (not strictly necessary, but just in case)
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
}

# Turn off screen quickly once the session is locked (auto or manual lock).
listener {
    timeout = 15
    on-timeout = pidof hyprlock && hyprctl dispatch dpms off
    on-resume = pidof hyprlock && hyprctl dispatch dpms on
}

# Pre-lock warning: random audible cue + notification, 30s before lock.
listener {
    timeout = 570                    # 9:30 — 30s before lock
    on-timeout = ($scriptsDir/OnBattery.sh && $scriptsDir/IdleAlert.sh warn) & notify-send -a hypridle -t 5000 -e -i $iDIR " Locking in 30s"
    on-resume = notify-send -a hypridle -t 3000 -e -i $iDIR " Welcome back!"
}

# Screenlock
listener {
    timeout = 600                    # 10 min
    on-timeout = loginctl lock-session # command to run when timeout has passed
    #on-resume = notify-send -i $iDIR " System Unlocked!"  # command to run when activity is detected after timeout has fired.
}

# Fallback DPMS-off a few seconds after lock, in case the locked-screen listener above didn't fire.
listener {
    timeout = 605
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
