# Written by scripts/GenerateHypridle.sh from
# UserConfigs/IdleSettings.conf. Any edit here is lost the next time the
# generator runs -- on upgrade, or when the charger is plugged or unplugged.
# Change the knobs in IdleSettings.conf instead, then:
#
#     ~/.config/hypr/scripts/GenerateHypridle.sh --restart
#
# Active profile: AC
#
#   lock timeout        900s
#   warning lead        30s before the lock
#   blank delay         15s after lock (hyprlock)
#   screensaver window  1200s after lock (swaylock-plugin)
#   dpms-off            enabled
#   nag/watchdog        disabled
#
# Timeouts below are absolute seconds since the last input event, which is why
# the post-lock listeners read as lock + window.

$iDIR = $HOME/.config/swaync/images/ja.png
$scriptsDir = $HOME/.config/hypr/scripts

general {
    # SwaylockScreensaver.sh runs swaylock-plugin with an xscreensaver hack
    # background (picker: SUPER SHIFT L) and execs hyprlock itself when the
    # package is absent; the || catches a swaylock-plugin that fails or is
    # killed, so a lock trigger can never leave the session unlocked.
    lock_cmd = $scriptsDir/SwaylockScreensaver.sh || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = $scriptsDir/ScreenPower.sh on
    ignore_dbus_inhibit = false
}

# Manual lock, hyprlock: blank 15s after the lock keypress.
listener {
    timeout = 15
    on-timeout = pidof hyprlock && $scriptsDir/ScreenPower.sh off
    on-resume = pidof hyprlock && $scriptsDir/ScreenPower.sh on
}

# Pre-lock warning, 30s before the lock.
listener {
    timeout = 870
    on-timeout = notify-send -a hypridle -t 5000 -e -i $iDIR " Locking in 30s"
    on-resume = notify-send -a hypridle -t 3000 -e -i $iDIR " Welcome back!"
}

# Auto-lock after 900s of inactivity (AC profile).
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# Idle lock, hyprlock: blank 15s after the lock fires.
listener {
    timeout = 915
    on-timeout = pidof swaylock-plugin || $scriptsDir/ScreenPower.sh off
    on-resume = $scriptsDir/ScreenPower.sh on
}

# Manual lock, screensaver: 1200s of animation, then blank.
listener {
    timeout = 1200
    on-timeout = pidof swaylock-plugin && $scriptsDir/ScreenPower.sh off
    on-resume = pidof swaylock-plugin && $scriptsDir/ScreenPower.sh on
}

# Idle lock, screensaver: 1200s of animation, then blank.
listener {
    timeout = 2100
    on-timeout = pidof swaylock-plugin && $scriptsDir/ScreenPower.sh off
    on-resume = pidof swaylock-plugin && $scriptsDir/ScreenPower.sh on
}
