# Idle alert / watchdog overrides.
# Sourced by ~/.config/hypr/scripts/IdleAlert.sh and IdleWatchdog.sh.
# Everything commented out = script defaults apply.
#
# Sound pools per tier. Filenames are relative to ~/Music/notifications/.
# Uncomment any array below to override the built-in pool.
#
# SOUNDS_warn=(
#     "Excuse Me Sir.ogg"
#     "Psst.ogg"
# )
# SOUNDS_gentle=(
#     "Bleep.ogg"
#     "Sifi notification blip.ogg"
# )
# SOUNDS_nag=(
#     "Grr Argh.ogg"
#     "Mouthbreather.ogg"
# )
# SOUNDS_dumbass=(
#     "Error Spam.ogg"
#     "Spam 1.ogg"
# )
#
# Seconds between post-lock watchdog squawks.
# IDLE_WATCHDOG_INTERVAL controls the gentle/nag tiers (default 300 = 5 min).
# IDLE_WATCHDOG_INTERVAL_DUMBASS kicks in once escalation hits the dumbass
# tier (default 60 = 1 min).
# IDLE_WATCHDOG_INTERVAL=300
# IDLE_WATCHDOG_INTERVAL_DUMBASS=60
#
# Screen flash alongside each post-lock squawk.
# Pattern: one long initial hold, then N follow-up pulses whose on-time
# decays by FLASH_PULSE_DECAY; off-time between pulses stays constant.
# IDLE_WATCHDOG_FLASH=true                 # master on/off
# IDLE_WATCHDOG_FLASH_INITIAL_ON_SEC=5.0   # opening screen-on hold
# IDLE_WATCHDOG_FLASH_PULSES=5             # follow-up pulse count
# IDLE_WATCHDOG_FLASH_PULSE_START_SEC=2.0  # first follow-up pulse on-time
# IDLE_WATCHDOG_FLASH_PULSE_DECAY=0.25     # on-time multiplier per pulse (<1 = faster)
# IDLE_WATCHDOG_FLASH_PULSE_OFF_SEC=0.25   # fixed screen-off gap between pulses
# IDLE_WATCHDOG_FLASH_PULSE_MIN_SEC=0.1    # floor for on-time; decay products below this clamp up
#
# Add a new tier by defining SOUNDS_<name>=(...) and invoking
#   IdleAlert.sh <name>
# from hypridle.conf or the IdleWatchdog tier ladder.
